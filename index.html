<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6B46C1">
    <meta name="description" content="Eliza - Your AI Companion">
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <title>Eliza 💎</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            padding: 20px;
            touch-action: manipulation;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .status {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        
        .status.listening {
            background: rgba(46, 204, 113, 0.3);
            animation: pulse 1.5s infinite;
        }
        
        .status.speaking {
            background: rgba(52, 152, 219, 0.3);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .chat-container {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            overflow-y: auto;
            max-height: 50vh;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 15px;
            max-width: 85%;
        }
        
        .message.user {
            background: rgba(52, 152, 219, 0.3);
            margin-left: auto;
            text-align: right;
        }
        
        .message.eliza {
            background: rgba(155, 89, 182, 0.3);
            margin-right: auto;
        }
        
        .message-text {
            font-size: 1.1rem;
            line-height: 1.4;
        }
        
        .message-time {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            min-width: 140px;
            padding: 25px;
            border: none;
            border-radius: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-talk {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }
        
        .btn-clear {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            box-shadow: 0 4px 15px rgba(149, 165, 166, 0.4);
        }

        /* Cartesia open button (small variant) */
        .btn-cartesia {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.25);
            min-width: 180px;
        }
        
        .settings {
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
        }
        
        .setting-item {
            margin-bottom: 10px;
        }
        
        .setting-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        
        .setting-item select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
        }
        
        .error-message {
            background: rgba(231, 76, 60, 0.3);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Cartesia container */
        #cartesia {
            height: 320px;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💎 Eliza 💎</h1>
        <p>Your AI Companion</p>
    </div>
    
    <div class="error-message" id="errorMessage"></div>
    
    <div class="status" id="status">Ready to talk</div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message eliza">
            <div class="message-text">Hello! I'm Eliza. Press "Talk to Eliza" and speak to me! 💙</div>
            <div class="message-time">Ready</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn btn-talk" id="talkBtn">
            🎤 Talk to Eliza
        </button>
        <button class="btn btn-stop" id="stopBtn" disabled>
            ⏹️ Stop
        </button>
        <button class="btn btn-clear" id="clearBtn">
            🗑️ Clear Chat
        </button>
        <button class="btn btn-cartesia" id="openCartesiaBtn" disabled>
            🗺️ Open Cartesia
        </button>
    </div>
    
    <div id="cartesia"></div>

    <div class="settings">
        <div class="setting-item">
            <label for="languageSelect">Language:</label>
            <select id="languageSelect">
                <option value="en-US">English</option>
                <option value="id-ID">Bahasa Indonesia</option>
            </select>
        </div>
        <div class="setting-item">
            <label for="voiceSelect">Voice:</label>
            <select id="voiceSelect">
                <!-- Will be populated by JavaScript -->
            </select>
        </div>
    </div>
    
    <!-- Cartesia SDK (CDN) -->
    <script src="https://cdn.cartesia.ai/cartesia.min.js"></script>

    <!-- Small Cartesia wrapper that exposes window.initCartesia -->
    <script src="cartesia-init.js"></script>

    <!-- Optional runtime placeholder for API key (replace at deploy time; do NOT commit real key) -->
    <!-- Example usage: set environment or hosting platform to inject an actual key -->
    <script>
      // window.__CARTESIA_KEY__ = 'CARTESIA_API_KEY_PLACEHOLDER';
      // For security, set this at deploy time in your hosting/CI, or use server-side injection.
    </script>

    <script src="app.js"></script>
</body>
</html>
